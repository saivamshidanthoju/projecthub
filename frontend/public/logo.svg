<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="60%" stop-color="#ff1a55" />
      <stop offset="100%" stop-color="#ff5e36" />
    </linearGradient>
    <mask id="doc-mask">
      <!-- Keep white parts -->
      <rect x="120" y="100" width="272" height="280" rx="52" fill="white" />
      <path d="M 292 290 H 392 V 424 L 342 380 L 292 424 Z" fill="white" />
      <!-- Subtract black parts -->
      <rect x="152" y="132" width="208" height="216" rx="24" fill="black" />
    </mask>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#logo-grad)" />
  
  <!-- Document outline and bookmark ribbon -->
  <g mask="url(#doc-mask)">
    <rect width="512" height="512" fill="white" />
  </g>
  
  <!-- Text lines (floats inside cutout) -->
  <rect x="184" y="172" width="144" height="28" rx="14" fill="white" />
  <rect x="184" y="232" width="144" height="28" rx="14" fill="white" />
  <rect x="184" y="292" width="80" height="28" rx="14" fill="white" />
</svg>
